version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: gym-pro-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gym-pro-funcional
    volumes:
      - mongodb_data:/data/db
    command: mongod --replSet rs0

  # Inicializar replica set (necesario para transacciones)
  mongo-init:
    image: mongo:7.0
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: |
      bash -c '
        sleep 5
        mongosh --host mongodb:27017 <<EOF
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          })
        EOF
      '

volumes:
  mongodb_data:
    driver: local
